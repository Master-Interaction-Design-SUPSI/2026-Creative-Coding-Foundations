<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./assets/script.js" defer></script>
    <link rel="stylesheet" href="./assets/style.css">
    <title>Page</title>
</head>
<body>

    <section id="button-container">
        <div class="box" id="click-box">
            <p class="label">Click me</p>
            <div id="click-container"></div>
        </div>
        <div class="box" id="hover-box">
            <p class="label" id="hover-label">Hover me</p>
        </div>
        <div class="box" id="text-box">
            <input type="type" id="text-input">
            <p class="label">Type me</p>
            <p id="text-output"></p>
        </div>
        <div class="box" id="change-box">
            <input type="number" id="user-input" min="0" max="360" value="100">
            <input type="number" id="user-brightness" min="0" max="100" value="50">
            <p id="user-output"></p>
            <p class="label">Change me</p>
        </div>
    </section>

</body>
</html>
